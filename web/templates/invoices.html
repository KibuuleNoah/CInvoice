{{define "invoices"}}
{{template "header" .}}
<div x-data="invoiceApp()" x-init="init()">

  <!-- Toast -->
  <div x-show="toast.show" x-transition x-cloak
    class="fixed bottom-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white"
    :class="toast.error ? 'bg-rose-600' : 'bg-emerald-600'" x-text="toast.msg"></div>

  <!-- Title & Create Button -->
  <!-- <div class="flex items-center justify-between"> -->
  <!--   <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Invoices</h1> -->
  <!--   <button @click="openCreate()" -->
  <!--     class="bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md shadow-orange-500/25 transition flex items-center space-x-2"> -->
  <!--     <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"> -->
  <!--       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /> -->
  <!--     </svg> -->
  <!--     <span>Create Invoice</span> -->
  <!--   </button> -->
  <!-- </div> -->

  <!-- Status Tabs -->
  <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4 border-b border-slate-200 pb-3 pt-4">
    <div class="flex items-center space-x-1 sm:space-x-3 overflow-x-auto pb-2 xl:pb-0">
      <template x-for="tab in tabs" :key="tab.key">
        <button @click="activeTab = tab.key; currentPage = 1"
          :class="activeTab === tab.key ? 'text-orange-600 border-orange-600 font-bold bg-orange-50/50' : 'text-slate-500 border-transparent font-medium hover:text-slate-800'"
          class="flex items-center space-x-1.5 px-3 py-2 border-b-2 text-xs rounded-t-lg transition whitespace-nowrap">
          <span x-text="tab.label"></span>
          <span class="ml-1 bg-slate-100 text-slate-600 text-[10px] font-bold px-1.5 py-0.2 rounded-full"
            x-text="countForTab(tab.key)"></span>
        </button>
      </template>
    </div>
  </div>

  <!-- Search and Info Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-4">
    <div class="relative w-full sm:w-80">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input x-model="searchQuery" type="text" placeholder="Search invoice or client"
        class="w-full pl-9 pr-4 py-1.5 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-orange-500 transition shadow-sm">
    </div>
    <div class="flex items-center space-x-2 text-xs text-slate-500 self-end sm:self-auto">
      <span>Showing</span>
      <select x-model.number="rowsPerPage" @change="currentPage = 1"
        class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs font-semibold text-slate-700 focus:outline-none focus:border-orange-500">
        <option value="15">15</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <span x-text="'of ' + filteredInvoices.length + ' results'"></span>
    </div>
  </div>

  <!-- Data Table -->
  <div class="bg-white border border-slate-200/90 rounded-2xl shadow-sm overflow-hidden mt-4">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="border-b border-slate-200 bg-slate-50/60 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            <th class="py-3 px-4 w-10 text-center">
              <input type="checkbox" @change="toggleSelectAll()" x-model="selectAll"
                class="rounded border-slate-300 text-orange-600 focus:ring-orange-500 w-3.5 h-3.5 cursor-pointer">
            </th>
            <th class="py-3 px-4">Invoice</th>
            <th class="py-3 px-4">Client</th>
            <th class="py-3 px-4">Amount</th>
            <th class="py-3 px-4">Due Date</th>
            <th class="py-3 px-4">Status</th>
            <th class="py-3 px-4 text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-xs text-slate-700">
          <template x-for="inv in pagedInvoices" :key="inv.id">
            <tr class="hover:bg-slate-50/80 transition group">
              <td class="py-3.5 px-4 text-center">
                <input type="checkbox" :value="inv.id" x-model="selectedInvoices"
                  class="rounded border-slate-300 text-orange-600 focus:ring-orange-500 w-3.5 h-3.5 cursor-pointer">
              </td>
              <td class="py-3.5 px-4 font-semibold text-slate-900">
                <div x-text="inv.invoiceNumber"></div>
                <div class="text-[11px] font-normal text-slate-400" x-text="'Created: ' + fmtDate(inv.createdAt)"></div>
              </td>
              <td class="py-3.5 px-4 font-medium text-slate-900" x-text="inv.client.clientName"></td>
              <td class="py-3.5 px-4 font-semibold text-slate-900" x-text="fmtMoney(inv.amount)"></td>
              <td class="py-3.5 px-4" x-text="fmtDate(inv.dueDate)"></td>
              <td class="py-3.5 px-4">
                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold" :class="{
                    'bg-amber-100/70 text-amber-700': inv.status === 'pending',
                    'bg-emerald-100/70 text-emerald-700': inv.status === 'paid',
                    'bg-rose-100/70 text-rose-700': inv.status === 'overdue'
                  }" x-text="inv.status"></span>
              </td>
              <td class="py-3.5 text-right space-x-1">
                <template x-if="inv.status !== 'paid'">
                  <div>
                    <button @click="confirmPaid(inv)"
                      class="p-1.5 rounded-lg hover:bg-emerald-50 text-slate-400 hover:text-emerald-700 transition">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 24 24">
                        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                        <path
                          d="M19 3h-2c0-.55-.45-1-1-1H8c-.55 0-1 .45-1 1H5c-1.1 0-2 .9-2 2v15c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2m0 17H5V5h2v2h10V5h2z">
                        </path>
                        <path
                          d="M11 14.09 8.71 11.8 7.3 13.21l3 3c.2.2.45.29.71.29s.51-.1.71-.29l5-5-1.41-1.41-4.29 4.29Z">
                        </path>
                      </svg>

                    </button>
                    <button @click="generateInvoicePdf(inv)"
                      class="p-1.5 rounded-lg hover:bg-orange-50 text-slate-400 hover:text-orange-600 transition">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 24 24">
                        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                        <path d="M4 18h16v2H4zm7-15v7H7l5 6 5-6h-4V3z"></path>
                      </svg>

                    </button>
                  </div>
                </template>
              </td>
            </tr>
          </template>
          <template x-if="filteredInvoices.length === 0">
            <tr>
              <td colspan="7" class="py-8 text-center text-slate-400 text-sm">
                <span x-show="!loading">No invoices found.</span>
                <span x-show="loading">Loading...</span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Pagination Footer -->
    <div class="px-6 py-4 bg-white border-t border-slate-200 flex items-center justify-between">
      <div class="text-xs text-slate-500 hidden sm:block">
        Selected <span class="font-semibold text-slate-700" x-text="selectedInvoices.length"></span> of
        <span x-text="filteredInvoices.length"></span> invoices
      </div>
      <div class="flex items-center space-x-1 mx-auto sm:mx-0">
        <button @click="currentPage > 1 ? currentPage-- : null"
          class="p-2 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition disabled:opacity-40"
          :disabled="currentPage === 1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <template x-for="p in pageNumbers" :key="p">
          <button @click="currentPage = p"
            :class="currentPage === p ? 'bg-slate-100 text-slate-900 font-bold border-slate-300' : 'bg-white text-slate-600 border-slate-200'"
            class="w-8 h-8 rounded-xl border text-xs font-semibold flex items-center justify-center hover:bg-slate-50 transition shadow-sm"
            x-text="p"></button>
        </template>
        <button @click="currentPage < totalPages ? currentPage++ : null"
          class="p-2 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition disabled:opacity-40"
          :disabled="currentPage === totalPages || totalPages === 0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Confirm Paid-->
  <div x-show="paidTarget" x-cloak x-transition.opacity
    class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div @click.outside="paidTarget = null" class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
      <h3 class="font-bold text-lg text-slate-900">Confirm Paid</h3>
      <p class="text-sm text-slate-500">Are you sure you want to mark this invoice as paid?</p>
      <div class="flex justify-end gap-2">
        <button @click="paidTarget = null"
          class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
        <button @click="paidInvoice()"
          class="px-4 py-2 rounded-xl bg-orange-600 text-white text-xs font-semibold hover:bg-orange-700">Mark
          Paid</button>
      </div>
    </div>
  </div>

</div>

<script>
  function emptyInvoiceForm() {
    return {id: '', clientId: '', amount: null, dueDate: '', status: 'pending'};
  }

  function invoiceApp() {
    return {
      invoices: [],
      loading: false,
      searchQuery: '',
      activeTab: 'all',
      tabs: [
        {key: 'all', label: 'All Invoices'},
        {key: 'pending', label: 'Pending'},
        {key: 'paid', label: 'Paid'},
        {key: 'overdue', label: 'Overdue'}
      ],
      rowsPerPage: 15,
      currentPage: 1,
      selectAll: false,
      selectedInvoices: [],
      paidTarget: null,
      toast: {show: false, msg: '', error: false},

      async init() {
        await Promise.all([this.fetchInvoices()]);
        console.log(this.invoices);
        console.log(this.clients);
      },

      get filteredInvoices() {
        let list = this.invoices;
        if (this.activeTab !== 'all') list = list.filter(i => i.status === this.activeTab);
        const q = this.searchQuery.toLowerCase().trim();
        if (q) {
          list = list.filter(i =>
            (i.invoiceNumber || '').toLowerCase().includes(q) ||
            (i.clientName || '').toLowerCase().includes(q));
        }
        return list;
      },

      countForTab(key) {
        return key === 'all' ? this.invoices.length : this.invoices.filter(i => i.status === key).length;
      },

      get totalPages() {
        return Math.max(1, Math.ceil(this.filteredInvoices.length / this.rowsPerPage));
      },

      get pagedInvoices() {
        if (this.currentPage > this.totalPages) this.currentPage = this.totalPages;
        const start = (this.currentPage - 1) * this.rowsPerPage;
        return this.filteredInvoices.slice(start, start + this.rowsPerPage);
      },

      get pageNumbers() {
        const pages = [];
        for (let i = 1; i <= this.totalPages; i++) pages.push(i);
        return pages;
      },

      toggleSelectAll() {
        this.selectedInvoices = this.selectAll ? this.pagedInvoices.map(i => i.id) : [];
      },

      async fetchInvoices() {
        this.loading = true;
        try {
          const res = await fetch('/api/v1/invoices');
          if (!res.ok) throw new Error();
          this.invoices = await res.json();
          console.log("invoices", this.invoices);
        } catch {
          this.notify('Failed to load invoices', true);
        } finally {
          this.loading = false;
        }
      },

      confirmPaid(inv) {
        this.paidTarget = inv;
      },

      async paidInvoice() {
        try {
          const res = await fetch(`/api/v1/invoices/${this.paidTarget.id}`, {method: 'PATCH'});
          if (!res.ok) throw new Error();
          this.paidTarget = null;
          await this.fetchInvoices();
          this.notify('Invoice marked as paid');
        } catch {
          this.paidTarget = null;
          this.notify('Mark as paid failed', true);
        }
      },

      fmtMoney(v) {
        return new Intl.NumberFormat('en-UG', {style: 'currency', currency: 'UGX', currencyDisplay: 'code'}).format(v || 0);
      },

      fmtDate(v) {
        if (!v) return '-';

        // If v is a number (or numeric string) representing a Unix timestamp in seconds
        const timestamp = typeof v === 'number' ? v : Number(v);
        const dateInput = (!isNaN(timestamp) && timestamp < 10000000000) ? timestamp * 1000 : v;

        const d = new Date(dateInput);
        return isNaN(d) ? v : d.toLocaleDateString('en-US', {year: 'numeric', month: 'short', day: 'numeric'});
      },

      notify(msg, error = false) {
        this.toast = {show: true, msg, error};
        setTimeout(() => this.toast.show = false, 2500);
      }
    }
  }
</script>
{{template "invoiceScripts" .}}
{{template "footer" .}}
{{end}}
