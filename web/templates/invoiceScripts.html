  function generateCustomerInformation(doc, invoice) {
    doc.setFontSize(20);
    doc.setFont("helvetica", "bold");
    doc.setTextColor("#FF5533");
    doc.text("Invoice", 500, 160);

    //generateHr(doc, 185);

    const top = 200;

    doc.setFillColor("#FF5533");
    doc.rect(0, 180, 800, 90, "F");

    doc.setTextColor("#FFFFFF");
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("Invoice no:", 50, top);
    doc.setFont("helvetica", "bold");
    doc.text(String(invoice.invoiceNumber), 150, top);
    doc.setFont("helvetica", "normal");
    doc.text("Invoice Date:", 50, top + 15);
    doc.text(formatDate(new Date(invoice.createdAt * 1000)), 150, top + 15);
    doc.text("Due Date:", 50, top + 30);
    doc.text(formatDate(new Date(invoice.dueDate)), 150, top + 30);

    doc.setFont("helvetica", "bold");
    doc.text("Balance Due:", 50, top + 49);
    doc.text(formatCurrency(invoice.amount - (invoice.paid || 0)), 150, top + 49);
    doc.setFont("helvetica", "normal");

    doc.setFont("helvetica", "bold");
    doc.text(invoice.client.clientName, 300, top);
    doc.setFont("helvetica", "normal");
    doc.text(invoice.client.address, 300, top + 15);
    doc.text("Contact: " + invoice.client.contact, 300, top + 30);

    //generateHr(doc, 262);
  }
  function generateInvoiceTable(doc, invoice) {
    let i;
    const invoiceTableTop = 340;
    const {client} = invoice;

    doc.setTextColor("#101010");
    doc.setFont("helvetica", "bold");
    generateTableRow(doc, invoiceTableTop, "Details", "", "", "VAT", "Sub Total");
    generateHr(doc, invoiceTableTop + 20);
    doc.setFont("helvetica", "normal");

    const items = [
      {
        details: "Security Services",
        armedGuards: " ",
        unarmedGuards: " ",
        vat: 0,
        subTotal: invoice.amount
      }
    ];

    for (i = 0; i < items.length; i++) {
      const item = items[i];
      const position = invoiceTableTop + (i + 1) * 30;
      generateTableRow(
        doc,
        position,
        item.details,
        "",
        "",
        item.vat,
        formatCurrency(item.subTotal)
      );
      generateHr(doc, position + 20);
    }

    const subtotalPosition = invoiceTableTop + (i + 1) * 30;
    generateTableRow(doc, subtotalPosition, "", "", "Subtotal", "", formatCurrency(invoice.amount));

    const duePosition = subtotalPosition + 25;
    doc.setFont("helvetica", "bold");
    doc.setTextColor("#FF5533");
    generateTableRow(doc, duePosition, "", "", "Balance Due", "", formatCurrency(invoice.amount - (invoice.paid || 0)));
    doc.setTextColor("#444444");
    doc.setFont("helvetica", "normal");
  }

    doc.text(String(quantity), 460, y, {align: "right"});
