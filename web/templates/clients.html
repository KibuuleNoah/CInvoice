{{define "clients"}}
{{template "header" .}}
<div x-data="clientApp()" x-init="init()">

  <!-- Toast -->
  <div x-show="toast.show" x-transition x-cloak
    class="fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white"
    :class="toast.error ? 'bg-rose-600' : 'bg-emerald-600'" x-text="toast.msg"></div>

  <!-- Title & Create Button -->
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Clients</h1>
    <button @click="openCreate()"
      class="bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md shadow-blue-500/25 transition flex items-center space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Create Client</span>
    </button>
  </div>

  <!-- Search and Info Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-4">
    <div class="relative w-full sm:w-80">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input x-model="searchQuery" type="text" placeholder="Search client or contact"
        class="w-full pl-9 pr-4 py-1.5 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500 transition shadow-sm">
    </div>
    <div class="flex items-center space-x-2 text-xs text-slate-500 self-end sm:self-auto">
      <span>Showing</span>
      <select x-model.number="rowsPerPage" @change="currentPage = 1"
        class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-500">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <span x-text="'of ' + filteredClients.length + ' results'"></span>
    </div>
  </div>

  <!-- Data Table -->
  <div class="bg-white border border-slate-200/90 rounded-2xl shadow-sm overflow-hidden mt-4">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="border-b border-slate-200 bg-slate-50/60 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            <th class="py-3 px-4 w-10 text-center">
              <input type="checkbox" @change="toggleSelectAll()" x-model="selectAll"
                class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5 cursor-pointer">
            </th>
            <th class="py-3 px-4">Client</th>
            <th class="py-3 px-4">Contact</th>
            <th class="py-3 px-4">Armed</th>
            <th class="py-3 px-4">Unarmed</th>
            <th class="py-3 px-4">Total Guards</th>
            <th class="py-3 px-4">Monthly Pay</th>
            <th class="py-3 px-4">Start Date</th>
            <th class="py-3 px-4 text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-xs text-slate-700">
          <template x-for="cl in pagedClients" :key="cl.id">
            <tr class="hover:bg-slate-50/80 transition group">
              <td class="py-3.5 px-4 text-center">
                <input type="checkbox" :value="cl.id" x-model="selectedClients"
                  class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-3.5 h-3.5 cursor-pointer">

              </td>
              <td class="py-3.5 px-4">
                <div class="font-semibold text-slate-900" x-text="cl.clientName"></div>
                <div class="text-[11px] text-slate-400 truncate max-w-[220px]" x-text="cl.address"></div>
              </td>
              <td class="py-3.5 px-4" x-text="cl.contact"></td>
              <td class="py-3.5 px-4" x-text="cl.armedCount + ' @ ' + fmtMoney(cl.armedUnitPrice)"></td>
              <td class="py-3.5 px-4" x-text="cl.unarmedCount + ' @ ' + fmtMoney(cl.unarmedUnitPrice)"></td>
              <td class="py-3.5 px-4 font-semibold text-slate-900" x-text="cl.totalGuards"></td>
              <td class="py-3.5 px-4 font-semibold text-emerald-600" x-text="fmtMoney(estTotal(cl))"></td>
              <td class="py-3.5 px-4" x-text="fmtDate(cl.startDate)"></td>
              <td class="py-3.5 px-1 text-right space-x-1">
                <button @click="openEdit(cl)"
                  class="p-1.5 rounded-lg hover:bg-slate-200/60 text-slate-400 hover:text-slate-700 transition">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    viewBox="0 0 24 24">
                    <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                    <path d="M5 21h14c1.1 0 2-.9 2-2v-7h-2v7H5V5h7V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2"></path>
                    <path
                      d="M7 13v3c0 .55.45 1 1 1h3c.27 0 .52-.11.71-.29l9-9a.996.996 0 0 0 0-1.41l-3-3a.996.996 0 0 0-1.41 0l-9.01 8.99A1 1 0 0 0 7 13m10-7.59L18.59 7 17.5 8.09 15.91 6.5zm-8 8 5.5-5.5 1.59 1.59-5.5 5.5H9z">
                    </path>
                  </svg>
                </button>
                <button @click="confirmDelete(cl)"
                  class="p-1.5 rounded-lg hover:bg-emerald-50 text-slate-400 hover:text-emerald-600 transition">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                    viewBox="0 0 24 24">
                    <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                    <path
                      d="M21 11h-3V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v13c0 1.65 1.35 3 3 3h14c1.65 0 3-1.35 3-3v-6c0-.55-.45-1-1-1M5 19c-.55 0-1-.45-1-1V5h12v13a3 3 0 0 0 .17 1zm15-1c0 .55-.45 1-1 1s-1-.45-1-1v-5h2z">
                    </path>
                    <path d="M6 7h8v2H6zm0 4h8v2H6zm5 4h3v2h-3z"></path>
                  </svg>

                </button>
              </td>
            </tr>
          </template>
          <template x-if="filteredClients.length === 0">
            <tr>
              <td colspan="9" class="py-8 text-center text-slate-400 text-sm">
                <span x-show="!loading">No matching clients found.</span>
                <span x-show="loading">Loading...</span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Pagination Footer -->
    <div class="px-6 py-4 bg-white border-t border-slate-200 flex items-center justify-between">
      <div class="text-xs text-slate-500 hidden sm:block">
        Selected <span class="font-semibold text-slate-700" x-text="selectedClients.length"></span> of
        <span x-text="filteredClients.length"></span> clients
      </div>
      <div class="flex items-center space-x-1 mx-auto sm:mx-0">
        <button @click="currentPage > 1 ? currentPage-- : null"
          class="p-2 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition disabled:opacity-40"
          :disabled="currentPage === 1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <template x-for="p in pageNumbers" :key="p">
          <button @click="currentPage = p"
            :class="currentPage === p ? 'bg-slate-100 text-slate-900 font-bold border-slate-300' : 'bg-white text-slate-600 border-slate-200'"
            class="w-8 h-8 rounded-xl border text-xs font-semibold flex items-center justify-center hover:bg-slate-50 transition shadow-sm"
            x-text="p"></button>
        </template>
        <button @click="currentPage < totalPages ? currentPage++ : null"
          class="p-2 rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition disabled:opacity-40"
          :disabled="currentPage === totalPages || totalPages === 0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div x-show="modalOpen" x-cloak x-transition.opacity
    class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-40"
    @keydown.escape.window="modalOpen = false">
    <div @click.outside="modalOpen = false" x-transition
      class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white">
        <h2 class="font-bold text-lg text-slate-900" x-text="editing ? 'Edit Client' : 'New Client'"></h2>
        <button @click="modalOpen = false" class="text-slate-400 hover:text-slate-700">✕</button>
      </div>
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="text-xs font-semibold text-slate-600">Client Name</label>
            <input x-model="form.clientName" type="text"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <p class="text-[11px] text-rose-500 mt-1" x-show="errors.clientName" x-text="errors.clientName"></p>
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs font-semibold text-slate-600">Address</label>
            <input x-model="form.address" type="text"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <p class="text-[11px] text-rose-500 mt-1" x-show="errors.address" x-text="errors.address"></p>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Contact</label>
            <input x-model="form.contact" type="text"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <p class="text-[11px] text-rose-500 mt-1" x-show="errors.contact" x-text="errors.contact"></p>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Start Date</label>
            <input x-model="form.startDate" type="date"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <p class="text-[11px] text-rose-500 mt-1" x-show="errors.startDate" x-text="errors.startDate"></p>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Armed Unit Price</label>
            <input x-model.number="form.armedUnitPrice" type="number" min="1"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Armed Count</label>
            <input x-model.number="form.armedCount" type="number" min="1"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Unarmed Unit Price</label>
            <input x-model.number="form.unarmedUnitPrice" type="number" min="1"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Unarmed Count</label>
            <input x-model.number="form.unarmedCount" type="number" min="1"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs font-semibold text-slate-600">Total Guards</label>
            <input x-model.number="form.totalGuards" type="number" min="1"
              class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <p class="text-[11px] text-slate-400 mt-1">
              Suggested: <span x-text="(form.armedCount||0) + (form.unarmedCount||0)"></span>
              <button type="button" class="underline ml-1"
                @click="form.totalGuards = (form.armedCount||0) + (form.unarmedCount||0)">use</button>
            </p>
          </div>
        </div>
        <div class="flex items-center justify-between pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-500">Est. Total: <span class="font-bold text-slate-900"
              x-text="fmtMoney(estTotal(form))"></span></span>
          <div class="flex gap-2">
            <button @click="modalOpen = false"
              class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
            <button @click="submitForm()" :disabled="saving"
              class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 disabled:opacity-50">
              <span x-text="saving ? 'Saving...' : (editing ? 'Update Client' : 'Create Client')"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div x-show="deleteTarget" x-cloak x-transition.opacity
    class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div @click.outside="deleteTarget = null" class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
      <h3 class="font-bold text-lg text-slate-900">Delete client?</h3>
      <p class="text-sm text-slate-500">This will permanently remove <span class="font-semibold"
          x-text="deleteTarget?.clientName"></span>.</p>
      <div class="flex justify-end gap-2">
        <button @click="deleteTarget = null"
          class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
        <button @click="deleteClient()"
          class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold hover:bg-rose-700">Delete</button>
      </div>
    </div>
  </div>

</div>

<script>
  function emptyForm() {
    return {
      id: '', clientName: '', address: '', armedUnitPrice: null, armedCount: null,
      unarmedUnitPrice: null, unarmedCount: null, totalGuards: null, startDate: '', contact: ''
    };
  }

  function clientApp() {
    return {
      clients: [],
      loading: false,
      searchQuery: '',
      rowsPerPage: 10,
      currentPage: 1,
      selectAll: false,
      selectedClients: [],
      modalOpen: false,
      editing: false,
      saving: false,
      deleteTarget: null,
      form: emptyForm(),
      errors: {},
      toast: {show: false, msg: '', error: false},

      async init() {
        await this.fetchClients();
      },

      get filteredClients() {
        const q = this.searchQuery.toLowerCase().trim();
        if (!q) return this.clients;
        return this.clients.filter(c =>
          (c.clientName || '').toLowerCase().includes(q) || (c.contact || '').toLowerCase().includes(q));
      },

      get totalPages() {
        return Math.max(1, Math.ceil(this.filteredClients.length / this.rowsPerPage));
      },

      get pagedClients() {
        if (this.currentPage > this.totalPages) this.currentPage = this.totalPages;
        const start = (this.currentPage - 1) * this.rowsPerPage;
        return this.filteredClients.slice(start, start + this.rowsPerPage);
      },

      get pageNumbers() {
        const pages = [];
        for (let i = 1; i <= this.totalPages; i++) pages.push(i);
        return pages;
      },

      toggleSelectAll() {
        this.selectedClients = this.selectAll ? this.pagedClients.map(c => c.id) : [];
      },

      async fetchClients() {
        this.loading = true;
        try {
          const res = await fetch('/api/v1/clients');
          if (!res.ok) throw new Error();
          this.clients = await res.json();
        } catch {
          this.notify('Failed to load clients', true);
        } finally {
          this.loading = false;
        }
      },

      openCreate() {
        this.editing = false;
        this.form = emptyForm();
        this.errors = {};
        this.modalOpen = true;
      },

      openEdit(cl) {
        this.editing = true;
        this.form = {...cl};
        this.errors = {};
        this.modalOpen = true;
      },

      validate() {
        this.errors = {};
        if (!this.form.clientName || this.form.clientName.length < 3) this.errors.clientName = 'Min 3 characters';
        if (!this.form.address || this.form.address.length < 3) this.errors.address = 'Min 3 characters';
        if (!this.form.contact || this.form.contact.length < 3) this.errors.contact = 'Min 3 characters';
        if (!this.form.startDate) this.errors.startDate = 'Required';
        return Object.keys(this.errors).length === 0;
      },

      async submitForm() {
        if (!this.validate()) return;
        this.saving = true;
        try {
          const url = this.editing ? `/api/v1/clients/${this.form.id}` : '/api/v1/clients';
          const method = this.editing ? 'PUT' : 'POST';
          const res = await fetch(url, {
            method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(this.form)
          });
          if (!res.ok) throw new Error();
          this.modalOpen = false;
          await this.fetchClients();
          this.notify(this.editing ? 'Client updated' : 'Client created');
        } catch {
          this.notify('Save failed', true);
        } finally {
          this.saving = false;
        }
      },

      confirmDelete(cl) {
        this.deleteTarget = cl;
      },

      async deleteClient() {
        try {
          const res = await fetch(`/api/v1/clients/${this.deleteTarget.id}`, {method: 'DELETE'});
          if (!res.ok) throw new Error();
          this.deleteTarget = null;
          await this.fetchClients();
          this.notify('Client deleted');
        } catch {
          this.notify('Delete failed', true);
        }
      },

      estTotal(c) {
        return (c.armedUnitPrice || 0) * (c.armedCount || 0) + (c.unarmedUnitPrice || 0) * (c.unarmedCount || 0);
      },

      fmtMoney(v) {
        return new Intl.NumberFormat('en-UG', {style: 'currency', currency: 'UGX', currencyDisplay: 'code'}).format(v || 0);
      },

      fmtDate(isoString) {
        if (!isoString) return '';
        return new Date(isoString).toLocaleDateString('en-GB', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        });
      },

      notify(msg, error = false) {
        this.toast = {show: true, msg, error};
        setTimeout(() => this.toast.show = false, 2500);
      }
    }
  }
</script>
{{template "footer" .}}
{{end}}
